<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>interactions</title>
    <style>
      body {
        padding: 0;
        margin: 0;
        width: 100vw;
        height: 100vh;
      }
      #app {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      .btn-group {
        position: absolute;
        bottom: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      }
      .btn-group button {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 16px;
        color: #333;
        background: transparent;
        border: none;
        border-radius: 6px;
        cursor: pointer;

        transition:
          background 0.15s,
          color 0.15s;
      }
      .btn-group button:hover {
        background: #f0f0f0;
        color: #000;
      }

      .btn-group button:active {
        background: #e0e0e0;
      }

      .btn-group button:focus-visible {
        outline: 2px solid #4caf50;
        outline-offset: 2px;
      }
      .tip {
        position: absolute;
        left: 12px;
        top: 12px;
        padding: 10px 14px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        font-size: 13px;
        line-height: 1.8;
        color: #333;
        max-width: 320px;
      }

      .tip-line + .tip-line {
        margin-top: 4px;
      }

      .tip kbd {
        display: inline-block;
        padding: 1px 6px;
        margin: 0 2px;
        font-family: inherit;
        font-size: 12px;
        color: #333;
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08);
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="btn-group">
      <button class="up" title="上移">↑</button>
      <button class="down" title="下移">↓</button>
      <button class="left" title="左移">←</button>
      <button class="right" title="右移">→</button>
      <button class="zoom-in" title="放大">+</button>
      <button class="zoom-out" title="缩小">-</button>
    </div>
    <div class="tip">
      <div class="tip-line">双击空白处：添加节点</div>
      <div class="tip-line">
        按住 <kbd>Shift</kbd> 点击节点：开启连接；再点击另一节点：确认连接；点击空白处：取消连接
      </div>
      <div class="tip-line">按住 <kbd>Alt</kbd> 点击节点或边：删除节点或边</div>
    </div>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
