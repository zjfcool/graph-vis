<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>link</title>
    <style>
      body {
        padding: 0;
        margin: 0;
        width: 100vw;
        height: 100vh;
      }
      #app {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      .tip {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        max-width: 320px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);

        font-size: 13px;
        line-height: 1.8;
        color: #333;
      }

      .tip kbd {
        display: inline-block;
        padding: 1px 6px;
        margin: 0 2px;

        font-family: inherit;
        font-size: 12px;
        color: #333;

        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08);
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="tip">
      <div class="tip-line">
        按住 <kbd>Shift</kbd> 并点击节点开始连接，点击另一个节点或空白处结束连线
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
